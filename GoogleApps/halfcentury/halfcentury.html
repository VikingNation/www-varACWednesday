<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
        line-height: 1.5;
      }

      h3 {
        text-align: center;
        margin-bottom: 20px;
      }

      .search-box {
        margin-bottom: 20px;
        background: #f4f4f4;
        padding: 15px;
        border-radius: 8px;
      }

      input {
        padding: 10px;
        width: 250px;
        border: 1px solid #ccc;
        border-radius: 4px;
        text-transform: uppercase;
        font-size: 16px;
      }

      button {
        padding: 10px 18px;
        background: #4A90E2;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background: #357ABD;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      th {
        background-color: #4A90E2;
        color: white;
        text-align: left;
        padding: 12px;
        font-size: 16px;
      }

      td {
        border-bottom: 1px solid #ddd;
        padding: 10px;
        font-size: 15px;
      }

      tr:nth-child(even) {
        background-color: #f9f9f9;
      }

      .msg-box {
        padding: 20px;
        border-radius: 4px;
        margin-top: 20px;
        font-weight: bold;
      }

      .no-results {
        background-color: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
      }

      .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      /* 📱 MOBILE OPTIMIZATION */
      @media (max-width: 600px) {
        body {
          margin: 10px;
        }

        .search-box {
          padding: 12px;
        }

        input {
          width: 100%;
          margin-bottom: 10px;
          font-size: 18px;
        }

        button {
          width: 100%;
          font-size: 18px;
        }

        table, thead, tbody, th, td, tr {
          display: block;
        }

        thead {
          display: none;
        }

        tr {
          margin-bottom: 12px;
          border: 1px solid #ddd;
          border-radius: 6px;
          padding: 10px;
          background: white;
        }

        td {
          display: flex;
          justify-content: space-between;
          padding: 8px 5px;
          font-size: 16px;
        }

        td::before {
          content: attr(data-label);
          font-weight: bold;
          color: #333;
        }
      }

    </style>
  </head>

  <body>

    <h3>VarAC Wednesday – Half‑Century Award Winners</h3>

    <div id="status">Loading award winners...</div>
    <div id="output"></div>

    <script>
      google.script.run
        .withSuccessHandler(function(response) {
          const statusDiv = document.getElementById('status');
          const outputDiv = document.getElementById('output');

          statusDiv.innerHTML = "";

          if (!response || response.error) {
            outputDiv.innerHTML =
              '<div class="msg-box error">' +
              (response?.error || "Unknown server error") +
              '</div>';
            return;
          }

          if (response.winners.length === 0) {
            outputDiv.innerHTML =
              '<div class="msg-box no-results">No operators have reached 50 check‑ins yet.</div>';
            return;
          }

          let html = '<table><thead><tr>';
          html += '<th>Earned In Week #</th><th>Date Achieved</th><th>Callsign</th>';
          html += '</tr></thead><tbody>';

          response.winners.forEach(row => {
            html += '<tr>';
            html += '<td data-label="Week #">' + row.week + '</td>';
            html += '<td data-label="Date">' + row.date + '</td>';
            html += '<td data-label="Callsign"><strong>' + row.callsign + '</strong></td>';
            html += '</tr>';
          });

          html += '</tbody></table>';
          outputDiv.innerHTML = html;
        })
        .withFailureHandler(function(err) {
          document.getElementById('output').innerHTML =
            '<div class="msg-box error">System Failure: ' + err.message + '</div>';
        })
        .runHalfCentury();
    </script>

  </body>
</html>
