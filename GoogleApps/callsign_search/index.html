<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: sans-serif; margin: 20px; line-height: 1.5; }
      .search-box { margin-bottom: 20px; background: #f4f4f4; padding: 15px; border-radius: 8px; }
      input { padding: 8px; width: 200px; border: 1px solid #ccc; border-radius: 4px; text-transform: uppercase; }
      button { padding: 8px 15px; background: #4A90E2; color: white; border: none; border-radius: 4px; cursor: pointer; }
      button:hover { background: #357ABD; }
      
      table { width: 100%; border-collapse: collapse; margin-top: 20px; }
      th { background-color: #4A90E2; color: white; text-align: left; padding: 12px; }
      td { border-bottom: 1px solid #ddd; padding: 10px; }
      tr:nth-child(even) { background-color: #f9f9f9; }
      
      .msg-box { padding: 20px; border-radius: 4px; margin-top: 20px; font-weight: bold; }
      .no-results { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
      .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
  </head>
  <body>

    <h3>VarAC Wednesday Checkin Lookup</h3>

    <div class="search-box">
      <label for="callsignInput"><strong>Callsign:</strong> </label>
      <input type="text" id="callsignInput" placeholder="Enter Callsign...">
      <button onclick="performSearch()">Search</button>
    </div>
    
    <div id="status"></div>
    <div id="output"></div>

    <script>
      // Allow pressing "Enter" to search
      document.getElementById("callsignInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") performSearch();
      });

      function performSearch() {
        const val = document.getElementById('callsignInput').value.trim();
        const statusDiv = document.getElementById('status');
        const outputDiv = document.getElementById('output');

        if (!val) {
          statusDiv.innerHTML = "Please enter a callsign.";
          return;
        }

        statusDiv.innerHTML = "Searching for " + val + "...";
        outputDiv.innerHTML = "";

        google.script.run
          .withSuccessHandler(function(response) {
            statusDiv.innerHTML = "";

            if (!response) {
              outputDiv.innerHTML = '<div class="msg-box error">Error: Server returned null.</div>';
              return;
            }

            // If the server explicitly told us no results were found
            if (response.noResults) {
              outputDiv.innerHTML = '<div class="msg-box no-results">' + 
                'Operator ' + response.callsign + ' has not checked into VarAC Wednesday</div>';
              return;
            }

            if (response.error) {
              outputDiv.innerHTML = '<div class="msg-box error">' + response.error + '</div>';
              return;
            }

            // Build Table
            let html = '<table><thead><tr>';
            response.headers.forEach(h => html += '<th>' + h + '</th>');
            html += '</tr></thead><tbody>';

            response.rows.forEach(row => {
              html += '<tr>';
              row.forEach(cell => html += '<td>' + cell + '</td>');
              html += '</tr>';
            });
            html += '</tbody></table>';
            outputDiv.innerHTML = html;
          })
          .withFailureHandler(function(err) {
            outputDiv.innerHTML = '<div class="msg-box error">System Failure: ' + err.message + '</div>';
          })
          .searchSpreadsheet(val);
      }
    </script>
  </body>
</html>
